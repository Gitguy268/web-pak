name: Bug report
description: Something in web-pak does not work.
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: What went wrong. If an archive failed, say which format and how it was made (which app or command).
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: To reproduce
      description: What you clicked or dropped, step by step.
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Where
      options:
        - compress
        - open / browse / preview
        - extract
        - test / convert / edit
        - tools (checksums, compare, passwords, age keys)
        - saving / downloads
        - other
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: "Browser and version, operating system (live site or local?)"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: The full error message. Please do not attach archives that hold private files or passwords.
